services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_knowledge_assistant_db
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data || true
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - assistant_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EMBEDDING_STACK: ${INSTALL_EMBEDDING_STACK:-0}
        INSTALL_CELERY_STACK: ${INSTALL_CELERY_STACK:-1}
    container_name: ai_knowledge_assistant_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CELERY_ENABLED: ${CELERY_ENABLED:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_REINDEX_QUEUE: ${CELERY_REINDEX_QUEUE:-reindex}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_CHAT_COMPLETIONS_URL: ${LLM_CHAT_COMPLETIONS_URL:-https://3xanny-secureapi.hf.space/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-220}
      WEB_SEARCH_OPENAI_ENABLED: ${WEB_SEARCH_OPENAI_ENABLED:-true}
      WEB_SEARCH_OPENAI_URL: ${WEB_SEARCH_OPENAI_URL:-https://3xanny-secureapi.hf.space/v1/chat/completions}
      WEB_SEARCH_OPENAI_MODEL: ${WEB_SEARCH_OPENAI_MODEL:-gpt-4o-mini}
      WEB_SEARCH_OPENAI_TIMEOUT_SEC: ${WEB_SEARCH_OPENAI_TIMEOUT_SEC:-20}
      SERPAPI_ENABLED: ${SERPAPI_ENABLED:-false}
      SERPAPI_ENGINE: ${SERPAPI_ENGINE:-google}
      SERPAPI_NUM_RESULTS: ${SERPAPI_NUM_RESULTS:-5}
      SERPAPI_TIMEOUT_SEC: ${SERPAPI_TIMEOUT_SEC:-15}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      assistant_internal:
      proxy_net:
        aliases:
          - assistant_app

  redis:
    image: redis:7-alpine
    container_name: ai_knowledge_assistant_redis
    restart: unless-stopped
    networks:
      - assistant_internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EMBEDDING_STACK: ${INSTALL_EMBEDDING_STACK:-0}
        INSTALL_CELERY_STACK: ${INSTALL_CELERY_STACK:-1}
    container_name: ai_knowledge_assistant_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHUNK_STORAGE_BACKEND: ${CHUNK_STORAGE_BACKEND:-file}
      CELERY_ENABLED: ${CELERY_ENABLED:-true}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_REINDEX_QUEUE: ${CELERY_REINDEX_QUEUE:-reindex}
    command:
      [
        "celery",
        "-A",
        "api.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "${CELERY_REINDEX_QUEUE:-reindex}",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    networks:
      - assistant_internal

networks:
  assistant_internal:
    driver: bridge
  proxy_net:
    external: true
