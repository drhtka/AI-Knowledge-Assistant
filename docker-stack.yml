services:
  db:
    image: ${DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init_sql
        target: /docker-entrypoint-initdb.d/01-init.sql
    secrets:
      - source: postgres_password
        target: postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag_net
    deploy:
      replicas: ${DB_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      resources:
        reservations:
          cpus: "${DB_CPU_RESERVATION:-0.25}"
          memory: ${DB_MEMORY_RESERVATION:-256M}
        limits:
          cpus: "${DB_CPU_LIMIT:-1.00}"
          memory: ${DB_MEMORY_LIMIT:-1G}

  app:
    image: ${APP_IMAGE:-ai-knowledge-assistant:local}
    environment:
      CHUNK_STORAGE_BACKEND: ${CHUNK_STORAGE_BACKEND:-pgvector}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ai_knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-public}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-document_chunks}
      PGVECTOR_EMBEDDING_DIM: ${PGVECTOR_EMBEDDING_DIM:-384}
      POSTGRES_RUNTIME_STATE_TABLE: ${POSTGRES_RUNTIME_STATE_TABLE:-runtime_state}
      POSTGRES_REINDEX_HISTORY_TABLE: ${POSTGRES_REINDEX_HISTORY_TABLE:-reindex_history}
      POSTGRES_RETRIEVAL_HISTORY_TABLE: ${POSTGRES_RETRIEVAL_HISTORY_TABLE:-retrieval_history}
      POSTGRES_WEB_SEARCH_HISTORY_TABLE: ${POSTGRES_WEB_SEARCH_HISTORY_TABLE:-web_search_history}
      CHUNK_SIZE_WORDS: ${CHUNK_SIZE_WORDS:-120}
      CHUNK_OVERLAP_WORDS: ${CHUNK_OVERLAP_WORDS:-30}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-220}
      SERPAPI_ENABLED: ${SERPAPI_ENABLED:-false}
      SERPAPI_ENGINE: ${SERPAPI_ENGINE:-google}
      SERPAPI_NUM_RESULTS: ${SERPAPI_NUM_RESULTS:-5}
      SERPAPI_TIMEOUT_SEC: ${SERPAPI_TIMEOUT_SEC:-15}
      PORT: ${APP_PORT:-8000}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DB_STARTUP_TIMEOUT_SEC: ${DB_STARTUP_TIMEOUT_SEC:-90}
    ports:
      - target: 8000
        published: ${APP_PORT:-8000}
        protocol: tcp
        mode: ingress
    volumes:
      - app_data:/app/data
    secrets:
      - source: postgres_password
        target: postgres_password
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_net
    deploy:
      replicas: ${APP_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
        parallelism: 1
      resources:
        reservations:
          cpus: "${APP_CPU_RESERVATION:-0.25}"
          memory: ${APP_MEMORY_RESERVATION:-256M}
        limits:
          cpus: "${APP_CPU_LIMIT:-1.00}"
          memory: ${APP_MEMORY_LIMIT:-1G}

configs:
  postgres_init_sql:
    file: ./docker/postgres/init/01-init.sql

secrets:
  postgres_password:
    external: true
    name: ${POSTGRES_PASSWORD_SECRET:-ai_knowledge_assistant_postgres_password}

volumes:
  pg_data:
  app_data:

networks:
  rag_net:
    driver: overlay
    attachable: true
