services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_knowledge_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init_sql
        target: /docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    image: ai-knowledge-assistant:local
    environment:
      CHUNK_STORAGE_BACKEND: pgvector
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_knowledge_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSL_MODE: disable
      PGVECTOR_DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_knowledge_assistant?sslmode=disable
      PGVECTOR_SCHEMA: public
      PGVECTOR_TABLE: document_chunks
      PGVECTOR_EMBEDDING_DIM: 384
      LLM_ENABLED: "false"
      SERPAPI_ENABLED: "false"
      PORT: 8000
      DB_STARTUP_TIMEOUT_SEC: 90
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
        parallelism: 1
      rollback_config:
        order: stop-first
        parallelism: 1

configs:
  postgres_init_sql:
    file: ./docker/postgres/init/01-init.sql

volumes:
  pg_data:
  app_data:

networks:
  rag_net:
    driver: overlay
